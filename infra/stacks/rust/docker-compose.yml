version: '3.8'

services:
  rust-server:
    build: .
    container_name: rust-server
    restart: unless-stopped
    ports:
      - "28015:28015/udp"
      - "28015:28015/tcp"
      - "28016:28016/tcp"
      - "28016:28016/udp"
    environment:
      - RUST_SERVER_STARTUP_ARGUMENTS=-load +server.secure 1
      - RUST_SERVER_IDENTITY=docker
      - RUST_SERVER_SEED=1337
      - RUST_SERVER_WORLDSIZE=3000
      - RUST_SERVER_NAME=Rust Server
      - RUST_SERVER_MAXPLAYERS=20
      - RUST_RCON_PASSWORD=docker
      - RUST_RCON_PORT=28016
      - RUST_SERVER_PORT=28015
      - RUST_SERVER_PASSWORD=evermore
    volumes:
      - rust_data:/steamcmd/rust

volumes:
  rust_data:
